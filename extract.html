<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SVG 坐标提取工具</title>
    <style>
        body { background-color: #1e1e1e; color: #d4d4d4; font-family: sans-serif; padding: 20px; }
        h2 { font-size: 16px; color: #569cd6; }
        textarea { width: 100%; height: 200px; background: #2d2d2d; color: #ce9178; border: 1px solid #444; padding: 10px; font-family: monospace; box-sizing: border-box; margin-bottom: 10px; resize: vertical; }
        button { padding: 10px 20px; background: #0e639c; color: white; border: none; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
        button:hover { background: #1177bb; }
        pre { width: 100%; height: 300px; background: #2d2d2d; color: #b5cea8; border: 1px solid #444; padding: 10px; overflow: auto; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; margin: 0; }
    </style>
</head>
<body>
    <h2>第一步：用 VS Code 打开你的 SVG 文件，复制全部代码粘贴到这里</h2>
    <textarea id="svgInput" placeholder="把 SVG 里面的 <svg>...</svg> 全部内容贴进来"></textarea>
    
    <button id="extractBtn">生成 JS 数据</button>

    <h2>第二步：点击上方按钮，然后复制下面生成的数据</h2>
    <pre id="result">等待生成...</pre>

    <script>
        document.getElementById('extractBtn').addEventListener('click', () => {
            const svgString = document.getElementById('svgInput').value.trim();
            if(!svgString) {
                alert("请先粘贴 SVG 代码！");
                return;
            }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgString, "image/svg+xml");
                const paths = doc.querySelectorAll("path");
                const resultArr = [];

                paths.forEach((path) => {
                    const d = path.getAttribute("d");
                    // 过滤掉长度太短的无用线段或纯黑描边
                    if (!d || d.length < 30) return; 
                    resultArr.push({ d: d });
                });

                // 生成最终的 JS 数组代码
                const finalCode = `const glassRegionsData = ${JSON.stringify(resultArr, null, 4)};`;
                document.getElementById('result').textContent = finalCode;
                
                if(resultArr.length === 0) {
                    document.getElementById('result').textContent = "❌ 提取失败，SVG 中没有找到 <path> 标签或路径太短。请检查 SVG 文件。";
                }

            } catch (error) {
                document.getElementById('result').textContent = "❌ 解析报错：" + error.message;
            }
        });
    </script>
</body>
</html>
